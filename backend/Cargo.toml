[package]
name = "backend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = {version = "0.7.7", features = ["multipart","macros"]}
axum-macros = "0.4.1"
chrono = "0.4.38"
dotenv = "0.15.0"
jsonwebtoken = "9.3.0"
serde = "1.0.200"
serde_json = "1.0.1"
surrealdb = "2.0.4"
tokio = "1.37.0"
tower-cookies = "0.10.0"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
hyper = "1.3.1"
axum-prometheus = "0.7.0"
tower-http = {version = "0.6.1", features = ["cors"]}
http = "1.1.0"
tower = "0.5.2"
zip = "4.2.0"
mime_guess = "2.0.5"



[dev-dependencies]
serial_test = "2"
